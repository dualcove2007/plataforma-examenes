server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (/dashboard, /examenes/3/editar, ...): siempre index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS y CSS llevan hash en el nombre: se pueden cachear mucho tiempo
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index nunca se cachea, para que tome siempre los últimos bundles
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}