<div class="shell">
  <header class="barra">
    <strong class="marca">Plataforma de Exámenes</strong>
    <div class="usuario">
      @if (auth.usuario(); as u) {
        <span class="nombre">{{ u.nombre }}</span>
        <span class="rol">{{ u.rol }}</span>
      }
      <a routerLink="/notificaciones" class="campana">
        Notificaciones
        @if (noLeidas() > 0) {
          <span class="contador">{{ noLeidas() }}</span>
        }
      </a>
      <button type="button" (click)="salir()">Cerrar sesión</button>
    </div>
  </header>

  <div class="cuerpo">
    <nav class="menu" aria-label="Principal">
      @for (e of enlaces(); track e.ruta) {
        <a [routerLink]="e.ruta" routerLinkActive="activo">{{ e.texto }}</a>
      }
    </nav>
    <main class="contenido">
      <router-outlet />
    </main>
  </div>
</div>
