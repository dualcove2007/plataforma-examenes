<main class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <h1>Plataforma de Exámenes</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    @if (error()) {
      <div class="alerta" role="alert">{{ error() }}</div>
    }

    <div class="campo">
      <label for="email">Correo</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [class.invalido]="invalido('email')"
      />
      @if (invalido('email')) {
        <small class="ayuda-error">Ingresa un correo válido.</small>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="campo-password">
        <input
          id="password"
          [type]="verPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [class.invalido]="invalido('password')"
        />
        <button
          type="button"
          class="ojo"
          (click)="alternarPassword()"
          [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="verPassword()"
        >
          @if (verPassword()) {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (invalido('password')) {
        <small class="ayuda-error">Ingresa tu contraseña.</small>
      }
    </div>

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</main>
