<main class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <h1>Plataforma de Exámenes</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    @if (error()) {
      <div class="alerta" role="alert">{{ error() }}</div>
    }

    <div class="campo">
      <label for="email">Correo</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [class.invalido]="invalido('email')"
      />
      @if (invalido('email')) {
        <small class="ayuda-error">Ingresa un correo válido.</small>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [class.invalido]="invalido('password')"
      />
      @if (invalido('password')) {
        <small class="ayuda-error">Ingresa tu contraseña.</small>
      }
    </div>

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</main>
